name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 本项目使用 pnpm（仓库中只有 pnpm-lock.yaml，没有 package-lock.json）。
      # pnpm/action-setup 必须放在 setup-node 之前，否则 cache: pnpm 找不到 pnpm 可执行文件。
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # PRD 7.6：项目站点需要 base = '/<仓库名>/'，用户/组织站点为 '/'
      - name: Resolve base path
        id: base
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          if [ "$REPO_NAME" = "${GITHUB_REPOSITORY_OWNER}.github.io" ]; then
            echo "base=/" >> "$GITHUB_OUTPUT"
          else
            echo "base=/$REPO_NAME/" >> "$GITHUB_OUTPUT"
          fi

      # enablement: true 会在 Pages 尚未启用时自动启用（需要上面的 pages: write 权限），
      # 省掉「去 Settings 手动把 Source 改成 GitHub Actions」这一步。
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build
        run: pnpm build
        env:
          VITE_BASE: ${{ steps.base.outputs.base }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
