name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 本项目使用 pnpm（仓库里只有 pnpm-lock.yaml，没有 package-lock.json）。
      # pnpm/action-setup 必须排在 setup-node 之前，否则 cache: pnpm 找不到 pnpm 可执行文件。
      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # PRD 7.6：项目站点需要 base = '/<仓库名>/'，用户/组织站点为 '/'
      - name: Resolve base path
        id: base
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          if [ "$REPO_NAME" = "${GITHUB_REPOSITORY_OWNER}.github.io" ]; then
            echo "base=/" >> "$GITHUB_OUTPUT"
          else
            echo "base=/$REPO_NAME/" >> "$GITHUB_OUTPUT"
          fi

      # 这里刻意**不使用** enablement: true。
      #
      # configure-pages 的文档明确写着该选项
      # "requires a token other than GITHUB_TOKEN to be provided"，
      # 也就是说用默认的 github.token 调用它**必然失败**，而且失败后整个 build 作业
      # 会中断、deploy 被跳过、Pages 永远启用不了。
      # 因此 Pages 需要在仓库 Settings → Pages 里手动启用一次（Source 选 GitHub Actions）。
      - uses: actions/configure-pages@v6

      - name: Build
        run: pnpm build
        env:
          VITE_BASE: ${{ steps.base.outputs.base }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
